<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Calendar</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e3e6ee;--accent:#3b6cf6;--today:#e8efff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2028;--text:#e8eaf0;--muted:#9aa1b0;--line:#2c303b;--accent:#6c8cff;--today:#252c45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2028;--text:#e8eaf0;--muted:#9aa1b0;--line:#2c303b;--accent:#6c8cff;--today:#252c45;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
.nav{display:flex;gap:6px;align-items:center}
#title{min-width:150px;text-align:center;font-weight:600;font-size:17px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#d93a3a;border-color:#d93a3a}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{background:var(--card);padding:6px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.day{background:var(--card);min-height:96px;padding:4px;cursor:pointer;overflow:hidden}
.day.other{opacity:.45}
.day.today{background:var(--today)}
.day .n{font-size:12px;color:var(--muted);margin-bottom:2px}
.day.today .n{color:var(--accent);font-weight:700}
.ev{font-size:12px;border-radius:4px;padding:1px 5px;margin-bottom:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.family{outline:2px solid rgba(0,0,0,.25);outline-offset:-2px;font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1}
.actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.actions .sp{flex:1}
.mrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.mrow input[type=color]{width:44px;padding:2px;height:34px;flex:none}
#agenda{display:none}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ag-item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}
.ag-dot{width:12px;height:12px;border-radius:50%;flex:none}
.ag-sub{font-size:12px;color:var(--muted)}
@media(max-width:640px){
  .wrap{padding:10px}
  header{justify-content:center}
  .day{min-height:52px;padding:3px;text-align:center}
  .day .n{font-size:13px}
  .ev{display:inline-block;width:8px;height:8px;padding:0;margin:1px;border-radius:50%;font-size:0;outline:none!important}
  .ev.family{outline:none;border-radius:2px}
  input,select,textarea{font-size:16px}
  .bar button,.bar select{flex:1 1 auto;min-height:40px}
  dialog{max-height:92vh;overflow:auto}
  #agenda{display:block;margin-top:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👨‍👩‍👧‍👦 Family Calendar</h1>
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <div id="title"></div>
      <button id="next" aria-label="Next month">›</button>
      <button id="today">Today</button>
    </div>
  </header>
  <div class="bar">
    <select id="fMember"></select>
    <select id="fType"><option value="">All types</option><option>Personal</option><option>Family</option></select>
    <button id="addBtn" class="primary">+ Add event</button>
    <button id="membersBtn">Family members</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
    <button id="themeBtn" aria-label="Toggle dark/light mode"></button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <div class="grid" id="grid"></div>
  <div id="agenda"></div>
</div>

<dialog id="evDlg">
  <form method="dialog" id="evForm">
    <h2 id="evHead" style="margin:0 0 4px;font-size:17px"></h2>
    <label>Title</label><input id="eTitle" required maxlength="80">
    <label>Type</label><select id="eType"><option>Personal</option><option>Family</option></select>
    <div class="row"><div><label>Start date</label><input id="eDate" type="date" required></div>
    <div><label>End date</label><input id="eEndDate" type="date" required></div></div>
    <label style="display:flex;gap:6px;align-items:center;color:var(--text);font-size:14px"><input id="eAllDay" type="checkbox" style="width:auto"> All day</label>
    <div class="row" id="timeRow"><div><label>Start time</label><select id="eStart"></select></div>
    <div><label>End time</label><select id="eEnd"></select></div></div>
    <div class="row"><div><label>Repeat</label><select id="eRepeat"><option value="none">Does not repeat</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
    <div id="untilWrap"><label>Repeat until (optional)</label><input id="eUntil" type="date"></div></div>
    <div id="repNote" style="font-size:12px;color:var(--muted);margin-top:4px;display:none">Editing or deleting changes the whole repeating series.</div>
    <label>Family member</label><select id="eMember"></select>
    <label>Notes</label><textarea id="eNotes" rows="3"></textarea>
    <div class="actions">
      <button type="button" id="eDel" class="danger">Delete</button><span class="sp"></span>
      <button type="button" id="eCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="memDlg">
  <h2 style="margin:0 0 8px;font-size:17px">Family members</h2>
  <div id="memList"></div>
  <button id="memAdd" type="button">+ Add member</button>
  <div class="actions"><button id="memDone" class="primary" type="button">Done</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,10);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let members = store.get('famcal.members', null) || [
  {id:'mom',name:'Mom',color:'#d6457b'},{id:'dad',name:'Dad',color:'#2f7fd1'},
  {id:'k1',name:'Kid 1',color:'#2e9e6b'},{id:'k2',name:'Kid 2',color:'#e08a1e'},
  {id:'all',name:'Everyone',color:'#7a4fd6'}];
let events = store.get('famcal.events', []);
const normalize = e => { e.date = e.date || e.endDate; e.endDate = (e.endDate && e.endDate >= e.date) ? e.endDate : e.date; e.allDay = !!e.allDay; e.repeat = e.repeat || 'none'; e.until = e.until || ''; return e; };
events.forEach(normalize);

// ---- time helpers (stored as 'HH:MM', shown as 12-hour) ----
const fmt12 = t => { if(!t) return ''; const [h,m] = t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`; };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fromMin = n => { n = ((n%1440)+1440)%1440; return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`; };
function buildTimeSelects(){
  let o = '<option value="">--</option>';
  for(let m=0;m<1440;m+=15) o += `<option value="${fromMin(m)}">${fmt12(fromMin(m))}</option>`;
  $('eStart').innerHTML = $('eEnd').innerHTML = o;
}
function setTime(id, v){
  const s = $(id);
  if(v && ![...s.options].some(x => x.value===v)){
    const op = new Option(fmt12(v), v);
    const next = [...s.options].find(x => x.value && x.value > v);
    s.add(op, next || null);
  }
  s.value = v || '';
}

// ---- recurrence ----
const dayNum = k => { const [y,m,d] = k.split('-').map(Number); return Date.UTC(y,m-1,d)/86400000; };
const addDays = (k,n) => { const t = new Date((dayNum(k)+n)*86400000); return t.toISOString().slice(0,10); };
function monthShift(k, n){ // same day-of-month n months later, clamped to month end
  const [y,m,d] = k.split('-').map(Number);
  const t = new Date(Date.UTC(y, m-1+n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate();
  t.setUTCDate(Math.min(d, last));
  return t.toISOString().slice(0,10);
}
function occursOn(e, key){
  if(key < e.date) return false;
  const span = dayNum(e.endDate) - dayNum(e.date);
  if(e.repeat === 'none') return key <= e.endDate;
  const diff = dayNum(key) - dayNum(e.date);
  if(e.repeat === 'weekly'){
    for(let k = Math.max(0, Math.ceil((diff-span)/7)); k <= Math.floor(diff/7); k++){
      const s = addDays(e.date, k*7);
      if(e.until && s > e.until) return false;
      if(diff - k*7 <= span) return true;
    }
    return false;
  }
  const [ky,km] = key.split('-').map(Number), [ey,em] = e.date.split('-').map(Number);
  const mdiff = (ky-ey)*12 + (km-em);
  for(let k = Math.max(0, mdiff - Math.ceil(span/28) - 1); k <= mdiff; k++){
    const s = monthShift(e.date, k);
    if(e.until && s > e.until) return false;
    if(key >= s && key <= addDays(s, span)) return true;
  }
  return false;
}
let view = new Date(); view.setDate(1);
let editingId = null;
var DEMO = /[?&]demo/.test(location.search); // used by mockup.html: sample data, nothing saved
const save = () => { if(DEMO) return; store.set('famcal.members', members); store.set('famcal.events', events); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const mem = id => members.find(m => m.id === id) || {name:'?',color:'#888'};

function fillMembers(){
  const opts = members.map(m => `<option value="${m.id}"></option>`).join('');
  $('eMember').innerHTML = opts;
  $('fMember').innerHTML = '<option value="">All members</option>' + opts;
  [...$('eMember').options, ...[...$('fMember').options].slice(1)].forEach(o => o.textContent = mem(o.value).name);
}

function render(){
  $('title').textContent = view.toLocaleString(undefined,{month:'long',year:'numeric'});
  const g = $('grid'); g.innerHTML = '';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { const e = document.createElement('div'); e.className='dow'; e.textContent=d; g.appendChild(e); });
  const start = new Date(view); start.setDate(1 - view.getDay());
  const fm = $('fMember').value, ft = $('fType').value, todayIso = iso(new Date());
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = iso(d);
    const cell = document.createElement('div');
    cell.className = 'day' + (d.getMonth()!==view.getMonth()?' other':'') + (key===todayIso?' today':'');
    const n = document.createElement('div'); n.className='n'; n.textContent=d.getDate(); cell.appendChild(n);
    events.filter(e => occursOn(e,key) && (!fm||e.memberId===fm) && (!ft||e.type===ft))
      .sort((a,b)=>(a.allDay?'':a.start||'').localeCompare(b.allDay?'':b.start||''))
      .forEach(e => {
        const c = document.createElement('div');
        c.className = 'ev' + (e.type==='Family'?' family':'');
        c.style.background = mem(e.memberId).color;
        c.textContent = (e.repeat!=='none'?'↻ ':'') + (!e.allDay && e.start? fmt12(e.start)+' ':'') + e.title;
        const when = e.date===e.endDate ? e.date : `${e.date} → ${e.endDate}`;
        c.title = `${e.title} (${mem(e.memberId).name}, ${e.type})\n${when}` + (e.allDay?' · All day':(e.start?` · ${fmt12(e.start)}${e.end?' – '+fmt12(e.end):''}`:'')) + (e.repeat!=='none'?`\nRepeats ${e.repeat}${e.until?' until '+e.until:''}`:'') + (e.notes?`\n${e.notes}`:'');
        c.onclick = ev => { if(isMobile()) return; ev.stopPropagation(); openEvent(e); };
        cell.appendChild(c);
      });
    if(key===selDay) cell.classList.add('sel');
    cell.onclick = () => { if(isMobile()){ selDay = key; render(); } else openEvent(null, key); };
    g.appendChild(cell);
  }
  renderAgenda();
}

const isMobile = () => matchMedia('(max-width:640px)').matches;
let selDay = iso(new Date());
function renderAgenda(){
  const a = $('agenda'); a.innerHTML = '';
  const fm = $('fMember').value, ft = $('fType').value;
  const [y,m,d] = selDay.split('-').map(Number);
  const h = document.createElement('div');
  h.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px';
  h.innerHTML = '<strong></strong>';
  h.firstChild.textContent = new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const add = document.createElement('button'); add.className='primary'; add.textContent='+ Add';
  add.onclick = () => openEvent(null, selDay);
  h.appendChild(add); a.appendChild(h);
  const list = events.filter(e => occursOn(e,selDay) && (!fm||e.memberId===fm) && (!ft||e.type===ft))
    .sort((p,q)=>(p.allDay?'':p.start||'').localeCompare(q.allDay?'':q.start||''));
  if(!list.length){ const p = document.createElement('div'); p.className='ag-sub'; p.textContent='No events this day.'; a.appendChild(p); }
  list.forEach(e => {
    const r = document.createElement('div'); r.className='ag-item';
    const dot = document.createElement('span'); dot.className='ag-dot'; dot.style.background = mem(e.memberId).color;
    const t = document.createElement('div'); t.style.flex='1';
    const when = e.allDay ? 'All day' : (e.start ? fmt12(e.start)+(e.end?' – '+fmt12(e.end):'') : 'No time');
    const b = document.createElement('div'); b.textContent = (e.repeat!=='none'?'↻ ':'')+e.title;
    const s = document.createElement('div'); s.className='ag-sub'; s.textContent = `${when} · ${mem(e.memberId).name} · ${e.type}`;
    t.append(b,s); r.append(dot,t); r.onclick = () => openEvent(e); a.appendChild(r);
  });
}

function openEvent(e, date){
  editingId = e ? e.id : null;
  $('evHead').textContent = e ? 'Edit event' : 'New event';
  $('eTitle').value = e?.title || '';
  $('eDate').value = e?.date || date || iso(new Date());
  $('eEndDate').value = e?.endDate || $('eDate').value;
  $('eType').value = e?.type || 'Personal';
  $('eAllDay').checked = !!e?.allDay;
  setTime('eStart', e?.start || '');
  setTime('eEnd', e?.end || '');
  $('eRepeat').value = e?.repeat || 'none';
  $('eUntil').value = e?.until || '';
  syncAllDay(); syncRepeat();
  $('eMember').value = e?.memberId || members[0]?.id;
  $('eNotes').value = e?.notes || '';
  $('eDel').style.display = e ? '' : 'none';
  $('evDlg').showModal();
}

function syncAllDay(){ $('timeRow').style.display = $('eAllDay').checked ? 'none' : ''; }
$('eAllDay').onchange = syncAllDay;
$('eDate').onchange = () => { if($('eEndDate').value < $('eDate').value) $('eEndDate').value = $('eDate').value; };
$('eEndDate').onchange = () => { if($('eEndDate').value < $('eDate').value) $('eEndDate').value = $('eDate').value; };

function syncRepeat(){
  const r = $('eRepeat').value !== 'none';
  $('untilWrap').style.visibility = r ? 'visible' : 'hidden';
  $('repNote').style.display = (r && editingId) ? 'block' : 'none';
}
$('eRepeat').onchange = syncRepeat;
// picking a start time auto-fills / shifts the end time (keeps duration, default 1 hour)
let prevStart = '';
$('eStart').addEventListener('focus', () => prevStart = $('eStart').value);
$('eStart').addEventListener('change', () => {
  const s = $('eStart').value, e = $('eEnd').value;
  if(!s) return;
  const dur = (e && prevStart) ? toMin(e) - toMin(prevStart) : 60;
  setTime('eEnd', fromMin(toMin(s) + (dur > 0 ? dur : 60)));
  prevStart = s;
});

$('evForm').addEventListener('submit', ev => {
  const allDay = $('eAllDay').checked;
  const data = {title:$('eTitle').value.trim(), date:$('eDate').value, endDate:$('eEndDate').value, type:$('eType').value, allDay,
    start:allDay?'':$('eStart').value, end:allDay?'':$('eEnd').value, memberId:$('eMember').value, notes:$('eNotes').value.trim(),
    repeat:$('eRepeat').value, until:$('eRepeat').value==='none' ? '' : $('eUntil').value};
  if(!data.title || !data.date) return;
  if(!data.endDate || data.endDate < data.date) data.endDate = data.date;
  if(data.start && data.end && data.date===data.endDate && toMin(data.end) <= toMin(data.start)){
    ev.preventDefault(); alert('End time must be after the start time.'); return;
  }
  if(data.until && data.until < data.date) data.until = '';
  if(editingId){ Object.assign(events.find(x=>x.id===editingId), data); }
  else events.push({id:uid(), ...data});
  save(); render();
});
$('eCancel').onclick = () => $('evDlg').close();
$('eDel').onclick = () => {
  if(confirm('Delete this event?')){ events = events.filter(x => x.id!==editingId); save(); render(); $('evDlg').close(); }
};

function renderMembers(){
  const l = $('memList'); l.innerHTML = '';
  members.forEach(m => {
    const r = document.createElement('div'); r.className='mrow';
    const c = document.createElement('input'); c.type='color'; c.value=m.color;
    c.oninput = () => { m.color = c.value; };
    const t = document.createElement('input'); t.value=m.name; t.maxLength=30;
    t.oninput = () => { m.name = t.value; };
    const x = document.createElement('button'); x.textContent='✕'; x.title='Remove';
    x.onclick = () => {
      if(members.length<=1) return alert('Keep at least one member.');
      const used = events.filter(e=>e.memberId===m.id).length;
      if(used && !confirm(`${m.name} has ${used} event(s). Remove the member and those events?`)) return;
      events = events.filter(e=>e.memberId!==m.id); members = members.filter(z=>z!==m); renderMembers();
    };
    r.append(c,t,x); l.appendChild(r);
  });
}
$('membersBtn').onclick = () => { renderMembers(); $('memDlg').showModal(); };
$('memAdd').onclick = () => { members.push({id:uid(),name:'New member',color:'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0')}); renderMembers(); };
$('memDone').onclick = () => { members.forEach(m => m.name = m.name.trim() || 'Unnamed'); save(); fillMembers(); render(); $('memDlg').close(); };

$('prev').onclick = () => { view.setMonth(view.getMonth()-1); render(); };
$('next').onclick = () => { view.setMonth(view.getMonth()+1); render(); };
$('today').onclick = () => { view = new Date(); view.setDate(1); render(); };
$('addBtn').onclick = () => openEvent(null);
$('fMember').onchange = $('fType').onchange = render;

$('exportBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({members,events},null,2)],{type:'application/json'}));
  a.download = 'family-calendar.json'; a.click();
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async ev => {
  try{
    const d = JSON.parse(await ev.target.files[0].text());
    if(!Array.isArray(d.members) || !Array.isArray(d.events)) throw 0;
    if(!confirm('Replace current calendar with imported data?')) return;
    members = d.members; events = d.events; save(); fillMembers(); render();
  }catch(e){ alert('Could not read that file.'); }
  ev.target.value = '';
};

function currentTheme(){
  const t = document.documentElement.dataset.theme;
  return t || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
}
function updateThemeBtn(){ $('themeBtn').textContent = currentTheme()==='dark' ? '☀️ Light' : '🌙 Dark'; }
try{ const t = localStorage.getItem('famcal.theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$('themeBtn').onclick = () => {
  const t = currentTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('famcal.theme', t); }catch(e){}
  updateThemeBtn();
};
updateThemeBtn();

if(DEMO){
  document.body.style.paddingTop = '34px'; // room for the phone's status bar / camera cut-out in mockup.html
  const t = iso(new Date()), E = (id,title,off,len,memberId,type,start,end,repeat) => ({id,title,date:addDays(t,off),endDate:addDays(t,off+len),repeat:repeat||'none',until:'',allDay:!start,start:start||'',end:end||'',memberId,type,notes:''});
  events = [E('1','Soccer practice',0,0,'k1','Personal','16:00','17:00','weekly'), E('2','Piano lesson',0,0,'k2','Personal','18:30','19:15'),
    E('3','Family dinner',2,0,'all','Family'), E('4','Beach trip',-5,2,'all','Family'), E('5','Dentist',4,0,'mom','Personal','09:00','10:00'),
    E('6','Book club',7,0,'dad','Personal','19:00','21:00','monthly')];
  if(/theme=dark/.test(location.search)) document.documentElement.dataset.theme = 'dark';
}
buildTimeSelects(); fillMembers(); render(); updateThemeBtn();
if(DEMO && /dialog/.test(location.search)) openEvent(events[0]);
</script>
</body>
</html>
