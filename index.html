<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHONG Family Calendar</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e3e6ee;--accent:#3b6cf6;--today:#e8efff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2028;--text:#e8eaf0;--muted:#9aa1b0;--line:#2c303b;--accent:#6c8cff;--today:#252c45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2028;--text:#e8eaf0;--muted:#9aa1b0;--line:#2c303b;--accent:#6c8cff;--today:#252c45;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
.nav{display:flex;gap:6px;align-items:center}
#title{min-width:150px;text-align:center;font-weight:600;font-size:17px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#d93a3a;border-color:#d93a3a}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{background:var(--card);padding:6px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.day{background:var(--card);min-height:96px;padding:4px;cursor:pointer;overflow:hidden}
.day.other{opacity:.45}
.day.today{background:var(--today)}
.day .n{font-size:12px;color:var(--muted);margin-bottom:2px}
.day.today .n{color:var(--accent);font-weight:700}
.ev{font-size:12px;border-radius:4px;padding:1px 5px;margin-bottom:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1}
.actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.actions .sp{flex:1}
.mrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.mrow input[type=color]{width:44px;padding:2px;height:34px;flex:none}
#agenda{display:none}
#lockedMsg{display:none}
body.locked .wrap{visibility:hidden}
/* Sign-in / locked page: the calendar is fully hidden. Put a photo named login-bg.jpg next to index.html to use it as the background. */
body.locked #lockedMsg{display:flex;position:fixed;inset:0;z-index:1;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;
  background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)),url('login-bg.jpg') center 30%/cover no-repeat,linear-gradient(135deg,#3b6cf6,#7a4fd6)}
body.auth-open #lockedMsg > *{visibility:hidden}
#authDlg::backdrop{background:rgba(0,0,0,.1)}
#authDlg{margin-top:auto;margin-bottom:6vh}   /* sits in the lower part so the photo's faces stay visible above it */
/* translucent "frosted glass" card (solid colour first, as a fallback for browsers without color-mix) */
#authDlg{background:var(--card);background:color-mix(in srgb,var(--card) 66%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.4)}
#authDlg .auth-sub,#authDlg label{color:var(--text)}
#authDlg #aPass{background:color-mix(in srgb,var(--card) 80%,transparent)}
@media(min-width:900px){#authDlg{margin-left:6vw;margin-right:auto}}   /* on wide screens: lower-left corner, clear of the faces */
.auth-title{font-size:19px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.auth-sub{margin:0 0 4px;color:var(--muted);font-size:14px}
.auth-show{display:flex;gap:6px;align-items:center;font-size:13px;margin:8px 0 0;cursor:pointer}
.auth-show input{width:auto}
#aErr{color:#e5484d;font-size:13px;min-height:18px;margin-top:8px}
#aPass{font-size:18px;letter-spacing:.05em}
.ev.clash{box-shadow:0 0 0 2px #e5484d}
#conflicts{display:none;margin-bottom:12px;border:1px solid #e5484d;border-radius:10px;background:rgba(229,72,77,.12);overflow:hidden}
.conf-head{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;font-weight:600;padding:8px 12px}
.conf-item{padding:6px 12px;font-size:13px;border-top:1px solid rgba(229,72,77,.35);cursor:pointer}
.conf-item:hover{background:rgba(229,72,77,.12)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ag-item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}
.ag-dot{width:12px;height:12px;border-radius:50%;flex:none}
.ag-sub{font-size:12px;color:var(--muted)}
@media(max-width:640px){
  .wrap{padding:10px}
  header{justify-content:center}
  .day{min-height:52px;padding:3px;text-align:center}
  .day .n{font-size:13px}
  .ev{display:inline-block;width:8px;height:8px;padding:0;margin:1px;border-radius:50%;font-size:0;outline:none!important}
  input,select,textarea{font-size:16px}
  .bar button,.bar select{flex:1 1 auto;min-height:40px}
  dialog{max-height:92vh;overflow:auto}
  #agenda{display:block;margin-top:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👨‍👩‍👧‍👦 CHONG Family Calendar</h1>
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <div id="title"></div>
      <button id="next" aria-label="Next month">›</button>
      <button id="today">Today</button>
    </div>
  </header>
  <div class="bar">
    <select id="fMember"></select>
    <button id="addBtn" class="primary">+ Add event</button>
    <button id="membersBtn">Family members</button>
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
    <button id="themeBtn" aria-label="Toggle dark/light mode"></button>
    <button id="lockBtn" style="display:none" title="Sign out of this device now">🔒 Lock</button>
    <span id="sync" style="font-size:12px;color:var(--muted)"></span>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <div id="conflicts" role="status"></div>
  <div class="grid" id="grid"></div>
  <div id="agenda"></div>
</div>

<dialog id="evDlg">
  <form method="dialog" id="evForm">
    <h2 id="evHead" style="margin:0 0 4px;font-size:17px"></h2>
    <label>Title</label><input id="eTitle" required maxlength="80">
    <div class="row"><div><label>Start date</label><input id="eDate" type="date" required></div>
    <div><label>End date</label><input id="eEndDate" type="date" required></div></div>
    <label style="display:flex;gap:6px;align-items:center;color:var(--text);font-size:14px"><input id="eAllDay" type="checkbox" style="width:auto"> All day</label>
    <div class="row" id="timeRow"><div><label>Start time</label><select id="eStart"></select></div>
    <div><label>End time</label><select id="eEnd"></select></div></div>
    <div class="row"><div><label>Repeat</label><select id="eRepeat"><option value="none">Does not repeat</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
    <div id="untilWrap"><label>Repeat until (optional)</label><input id="eUntil" type="date"></div></div>
    <div id="repNote" style="font-size:12px;color:var(--muted);margin-top:4px;display:none">Editing or deleting changes the whole repeating series.</div>
    <div id="conflict" role="alert" style="display:none;margin-top:10px;padding:8px 10px;border:1px solid #e5484d;border-radius:8px;background:rgba(229,72,77,.12);font-size:13px"></div>
    <label>Family member</label><select id="eMember"></select>
    <label>Notes</label><textarea id="eNotes" rows="3"></textarea>
    <div class="actions">
      <button type="button" id="eDel" class="danger">Delete</button><span class="sp"></span>
      <button type="button" id="eCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<div id="lockedMsg" role="status">
  <div style="font-size:44px" aria-hidden="true">🔒</div>
  <div style="font-weight:600;font-size:18px">Locked</div>
  <button id="unlockBtn" class="primary">Unlock</button>
</div>

<dialog id="authDlg" aria-labelledby="authTitle">
  <form id="authForm" autocomplete="on">
    <h2 id="authTitle" class="auth-title"><span aria-hidden="true">🔒</span> CHONG Family Calendar</h2>
    <p class="auth-sub">Enter the family passcode to open the calendar. You'll be asked again after 24 hours.</p>
    <label for="aPass">Passcode</label>
    <input id="aPass" name="passcode" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-describedby="aErr">
    <label class="auth-show"><input id="aShow" type="checkbox"> Show passcode</label>
    <div id="aErr" role="alert"></div>
    <div class="actions">
      <button type="button" id="aCancel">Not now</button>
      <button type="submit" id="aGo" class="primary">Unlock</button>
    </div>
  </form>
</dialog>

<dialog id="memDlg">
  <h2 style="margin:0 0 8px;font-size:17px">Family members</h2>
  <div id="memList"></div>
  <button id="memAdd" type="button">+ Add member</button>
  <div class="actions"><button id="memDone" class="primary" type="button">Done</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,10);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let members = store.get('famcal.members', null) || [
  {id:'mom',name:'Mom',color:'#d6457b'},{id:'dad',name:'Dad',color:'#2f7fd1'},
  {id:'k1',name:'Kid 1',color:'#2e9e6b'},{id:'k2',name:'Kid 2',color:'#e08a1e'},
  {id:'all',name:'Everyone',color:'#7a4fd6'}];
let events = store.get('famcal.events', []);
const normalize = e => { e.date = e.date || e.endDate; e.endDate = (e.endDate && e.endDate >= e.date) ? e.endDate : e.date; e.allDay = !!e.allDay; e.repeat = e.repeat || 'none'; e.until = e.until || ''; return e; };
events.forEach(normalize);

// ---- time helpers (stored as 'HH:MM', shown as 12-hour) ----
const fmt12 = t => { if(!t) return ''; const [h,m] = t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`; };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fromMin = n => { n = ((n%1440)+1440)%1440; return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`; };
function buildTimeSelects(){
  let o = '<option value="">--</option>';
  for(let m=0;m<1440;m+=15) o += `<option value="${fromMin(m)}">${fmt12(fromMin(m))}</option>`;
  $('eStart').innerHTML = $('eEnd').innerHTML = o;
}
function setTime(id, v){
  const s = $(id);
  if(v && ![...s.options].some(x => x.value===v)){
    const op = new Option(fmt12(v), v);
    const next = [...s.options].find(x => x.value && x.value > v);
    s.add(op, next || null);
  }
  s.value = v || '';
}

// ---- recurrence ----
const dayNum = k => { const [y,m,d] = k.split('-').map(Number); return Date.UTC(y,m-1,d)/86400000; };
const addDays = (k,n) => { const t = new Date((dayNum(k)+n)*86400000); return t.toISOString().slice(0,10); };
function monthShift(k, n){ // same day-of-month n months later, clamped to month end
  const [y,m,d] = k.split('-').map(Number);
  const t = new Date(Date.UTC(y, m-1+n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate();
  t.setUTCDate(Math.min(d, last));
  return t.toISOString().slice(0,10);
}
function occursOn(e, key){
  if(key < e.date) return false;
  const span = dayNum(e.endDate) - dayNum(e.date);
  if(e.repeat === 'none') return key <= e.endDate;
  const diff = dayNum(key) - dayNum(e.date);
  if(e.repeat === 'weekly'){
    for(let k = Math.max(0, Math.ceil((diff-span)/7)); k <= Math.floor(diff/7); k++){
      const s = addDays(e.date, k*7);
      if(e.until && s > e.until) return false;
      if(diff - k*7 <= span) return true;
    }
    return false;
  }
  const [ky,km] = key.split('-').map(Number), [ey,em] = e.date.split('-').map(Number);
  const mdiff = (ky-ey)*12 + (km-em);
  for(let k = Math.max(0, mdiff - Math.ceil(span/28) - 1); k <= mdiff; k++){
    const s = monthShift(e.date, k);
    if(e.until && s > e.until) return false;
    if(key >= s && key <= addDays(s, span)) return true;
  }
  return false;
}
let view = new Date(); view.setDate(1);
let editingId = null;
var DEMO = /[?&]demo/.test(location.search); // used by mockup.html: sample data, nothing saved
const saveLocal = () => { if(DEMO) return; store.set('famcal.members', members); store.set('famcal.events', events); store.set('famcal.updatedAt', updatedAt); };
const save = () => { saveLocal(); schedulePush(); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const mem = id => members.find(m => m.id === id) || {name:'?',color:'#888'};

function fillMembers(){
  const opts = members.map(m => `<option value="${m.id}"></option>`).join('');
  $('eMember').innerHTML = opts;
  $('fMember').innerHTML = '<option value="">All members</option>' + opts;
  [...$('eMember').options, ...[...$('fMember').options].slice(1)].forEach(o => o.textContent = mem(o.value).name);
}

// ---- conflict detection: any two events whose times overlap, whoever they are for ----
function interval(e){
  if(e.allDay || !e.start || e.date!==e.endDate) return [0,1440];
  const s = toMin(e.start); return [s, e.end ? toMin(e.end) : s+60];
}
function clash(a,b){
  const [a0,a1] = interval(a), [b0,b1] = interval(b);
  return a0 < b1 && b0 < a1;
}
function clashIds(list){
  const s = new Set();
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++) if(clash(list[i],list[j])){ s.add(list[i].id); s.add(list[j].id); }
  return s;
}
function findConflicts(d, ignoreId){   // d = draft event; returns up to 5 {e, day}
  const found = new Map();
  const limit = d.repeat==='none' ? d.endDate : addDays(d.date, 366);
  for(let k=d.date; k<=limit && found.size<5; k=addDays(k,1)){
    if(!occursOn(d,k)) continue;
    for(const e of events) if(e.id!==ignoreId && !found.has(e.id) && occursOn(e,k) && clash(d,e)) found.set(e.id,{e,day:k});
  }
  return [...found.values()];
}
function draft(){
  const allDay = $('eAllDay').checked, rep = $('eRepeat').value;
  const d = {date:$('eDate').value, endDate:$('eEndDate').value, allDay, start:allDay?'':$('eStart').value, end:allDay?'':$('eEnd').value,
    memberId:$('eMember').value, repeat:rep, until:rep==='none'?'':$('eUntil').value};
  if(!d.date) return null;
  if(!d.endDate || d.endDate < d.date) d.endDate = d.date;
  return d;
}
function showConflicts(){
  const box = $('conflict'), d = draft(), list = d ? findConflicts(d, editingId) : [];
  box.innerHTML = '';
  if(!list.length){ box.style.display = 'none'; return; }
  box.style.display = 'block';
  const h = document.createElement('strong'); h.textContent = '⚠ This overlaps with an existing event:'; box.appendChild(h);
  list.forEach(({e,day}) => {
    const line = document.createElement('div');
    const when = e.allDay ? 'all day' : (e.start ? fmt12(e.start)+(e.end?' – '+fmt12(e.end):'') : 'no time');
    line.textContent = `${e.title} (${mem(e.memberId).name}) · ${day} · ${when}`;
    box.appendChild(line);
  });
}

// persistent banner: every conflicting pair in the next 90 days, until the events are changed
let confOpen = false;
function allConflicts(){
  const pairs = new Map(), today = iso(new Date());
  for(let i=0;i<90;i++){
    const k = addDays(today, i), list = events.filter(e => occursOn(e,k));
    for(let x=0;x<list.length;x++) for(let y=x+1;y<list.length;y++) if(clash(list[x],list[y])){
      const id = list[x].id+'|'+list[y].id, p = pairs.get(id);
      if(p) p.more++; else pairs.set(id,{a:list[x],b:list[y],day:k,more:0});
    }
  }
  return [...pairs.values()];
}
function renderConflicts(){
  const box = $('conflicts'), list = allConflicts();
  box.innerHTML = '';
  if(!list.length){ box.style.display = 'none'; return; }
  box.style.display = 'block';
  const head = document.createElement('button');
  head.type = 'button'; head.className = 'conf-head';
  head.textContent = `⚠ ${list.length} scheduling conflict${list.length>1?'s':''} in the next 90 days — ${confOpen?'hide':'show'}`;
  head.onclick = () => { confOpen = !confOpen; renderConflicts(); };
  box.appendChild(head);
  if(!confOpen) return;
  const desc = e => `${e.title} (${mem(e.memberId).name}, ${e.allDay?'all day':e.start?fmt12(e.start)+(e.end?'–'+fmt12(e.end):''):'no time'})`;
  list.forEach(({a,b,day,more}) => {
    const r = document.createElement('div'); r.className = 'conf-item';
    r.textContent = `${day}${more?` (+${more} more date${more>1?'s':''})`:''}: ${desc(a)} overlaps ${desc(b)}`;
    r.onclick = () => openEvent(a);
    box.appendChild(r);
  });
}

function render(){
  $('title').textContent = view.toLocaleString(undefined,{month:'long',year:'numeric'});
  const g = $('grid'); g.innerHTML = '';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { const e = document.createElement('div'); e.className='dow'; e.textContent=d; g.appendChild(e); });
  const start = new Date(view); start.setDate(1 - view.getDay());
  const fm = $('fMember').value, todayIso = iso(new Date());
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = iso(d);
    const cell = document.createElement('div');
    cell.className = 'day' + (d.getMonth()!==view.getMonth()?' other':'') + (key===todayIso?' today':'');
    const n = document.createElement('div'); n.className='n'; n.textContent=d.getDate(); cell.appendChild(n);
    const dayAll = events.filter(e => occursOn(e,key)), clashing = clashIds(dayAll);
    dayAll.filter(e => !fm||e.memberId===fm)
      .sort((a,b)=>(a.allDay?'':a.start||'').localeCompare(b.allDay?'':b.start||''))
      .forEach(e => {
        const c = document.createElement('div');
        c.className = 'ev' + (clashing.has(e.id)?' clash':'');
        c.style.background = mem(e.memberId).color;
        c.textContent = (clashing.has(e.id)?'⚠ ':'') + (e.repeat!=='none'?'↻ ':'') + (!e.allDay && e.start? fmt12(e.start)+' ':'') + e.title;
        const when = e.date===e.endDate ? e.date : `${e.date} → ${e.endDate}`;
        c.title = `${e.title} (${mem(e.memberId).name})\n${when}` + (e.allDay?' · All day':(e.start?` · ${fmt12(e.start)}${e.end?' – '+fmt12(e.end):''}`:'')) + (e.repeat!=='none'?`\nRepeats ${e.repeat}${e.until?' until '+e.until:''}`:'') + (e.notes?`\n${e.notes}`:'');
        c.onclick = ev => { if(isMobile()) return; ev.stopPropagation(); openEvent(e); };
        cell.appendChild(c);
      });
    if(key===selDay) cell.classList.add('sel');
    cell.onclick = () => { if(isMobile()){ selDay = key; render(); } else openEvent(null, key); };
    g.appendChild(cell);
  }
  renderAgenda();
  renderConflicts();
}

const isMobile = () => matchMedia('(max-width:640px)').matches;
let selDay = iso(new Date());
function renderAgenda(){
  const a = $('agenda'); a.innerHTML = '';
  const fm = $('fMember').value;
  const [y,m,d] = selDay.split('-').map(Number);
  const h = document.createElement('div');
  h.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px';
  h.innerHTML = '<strong></strong>';
  h.firstChild.textContent = new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const add = document.createElement('button'); add.className='primary'; add.textContent='+ Add';
  add.onclick = () => openEvent(null, selDay);
  h.appendChild(add); a.appendChild(h);
  const dayAll = events.filter(e => occursOn(e,selDay)), clashing = clashIds(dayAll);
  const list = dayAll.filter(e => !fm||e.memberId===fm)
    .sort((p,q)=>(p.allDay?'':p.start||'').localeCompare(q.allDay?'':q.start||''));
  if(!list.length){ const p = document.createElement('div'); p.className='ag-sub'; p.textContent='No events this day.'; a.appendChild(p); }
  list.forEach(e => {
    const r = document.createElement('div'); r.className='ag-item';
    const dot = document.createElement('span'); dot.className='ag-dot'; dot.style.background = mem(e.memberId).color;
    const t = document.createElement('div'); t.style.flex='1';
    const when = e.allDay ? 'All day' : (e.start ? fmt12(e.start)+(e.end?' – '+fmt12(e.end):'') : 'No time');
    const clash = clashing.has(e.id);
    const b = document.createElement('div'); b.textContent = (clash?'⚠ ':'')+(e.repeat!=='none'?'↻ ':'')+e.title;
    const s = document.createElement('div'); s.className='ag-sub'; s.textContent = `${when} · ${mem(e.memberId).name}` + (clash?' · Conflict':'');
    if(clash) s.style.color = '#e5484d';
    t.append(b,s); r.append(dot,t); r.onclick = () => openEvent(e); a.appendChild(r);
  });
}

function openEvent(e, date){
  editingId = e ? e.id : null;
  $('evHead').textContent = e ? 'Edit event' : 'New event';
  $('eTitle').value = e?.title || '';
  $('eDate').value = e?.date || date || iso(new Date());
  $('eEndDate').value = e?.endDate || $('eDate').value;
  $('eAllDay').checked = !!e?.allDay;
  setTime('eStart', e?.start || '');
  setTime('eEnd', e?.end || '');
  $('eRepeat').value = e?.repeat || 'none';
  $('eUntil').value = e?.until || '';
  syncAllDay(); syncRepeat();
  $('eMember').value = e?.memberId || members[0]?.id;
  $('eNotes').value = e?.notes || '';
  $('eDel').style.display = e ? '' : 'none';
  showConflicts();
  $('evDlg').showModal();
}

function syncAllDay(){ $('timeRow').style.display = $('eAllDay').checked ? 'none' : ''; }
$('eAllDay').onchange = syncAllDay;
$('eDate').onchange = () => { if($('eEndDate').value < $('eDate').value) $('eEndDate').value = $('eDate').value; };
$('eEndDate').onchange = () => { if($('eEndDate').value < $('eDate').value) $('eEndDate').value = $('eDate').value; };

function syncRepeat(){
  const r = $('eRepeat').value !== 'none';
  $('untilWrap').style.visibility = r ? 'visible' : 'hidden';
  $('repNote').style.display = (r && editingId) ? 'block' : 'none';
}
$('eRepeat').onchange = syncRepeat;
$('evForm').addEventListener('input', showConflicts);
$('evForm').addEventListener('change', showConflicts);
// picking a start time auto-fills / shifts the end time (keeps duration, default 1 hour)
let prevStart = '';
$('eStart').addEventListener('focus', () => prevStart = $('eStart').value);
$('eStart').addEventListener('change', () => {
  const s = $('eStart').value, e = $('eEnd').value;
  if(!s) return;
  const dur = (e && prevStart) ? toMin(e) - toMin(prevStart) : 60;
  setTime('eEnd', fromMin(toMin(s) + (dur > 0 ? dur : 60)));
  prevStart = s;
});

$('evForm').addEventListener('submit', ev => {
  const allDay = $('eAllDay').checked;
  const data = {title:$('eTitle').value.trim(), date:$('eDate').value, endDate:$('eEndDate').value, allDay,
    start:allDay?'':$('eStart').value, end:allDay?'':$('eEnd').value, memberId:$('eMember').value, notes:$('eNotes').value.trim(),
    repeat:$('eRepeat').value, until:$('eRepeat').value==='none' ? '' : $('eUntil').value};
  if(!data.title || !data.date) return;
  if(!data.endDate || data.endDate < data.date) data.endDate = data.date;
  if(data.start && data.end && data.date===data.endDate && toMin(data.end) <= toMin(data.start)){
    ev.preventDefault(); alert('End time must be after the start time.'); return;
  }
  if(data.until && data.until < data.date) data.until = '';
  if(editingId){ Object.assign(events.find(x=>x.id===editingId), data); }
  else events.push({id:uid(), ...data});
  save(); render();
});
$('eCancel').onclick = () => $('evDlg').close();
$('eDel').onclick = () => {
  if(confirm('Delete this event?')){ events = events.filter(x => x.id!==editingId); save(); render(); $('evDlg').close(); }
};

function renderMembers(){
  const l = $('memList'); l.innerHTML = '';
  members.forEach(m => {
    const r = document.createElement('div'); r.className='mrow';
    const c = document.createElement('input'); c.type='color'; c.value=m.color;
    c.oninput = () => { m.color = c.value; };
    const t = document.createElement('input'); t.value=m.name; t.maxLength=30;
    t.oninput = () => { m.name = t.value; };
    const x = document.createElement('button'); x.textContent='✕'; x.title='Remove';
    x.onclick = () => {
      if(members.length<=1) return alert('Keep at least one member.');
      const used = events.filter(e=>e.memberId===m.id).length;
      if(used && !confirm(`${m.name} has ${used} event(s). Remove the member and those events?`)) return;
      events = events.filter(e=>e.memberId!==m.id); members = members.filter(z=>z!==m); renderMembers();
    };
    r.append(c,t,x); l.appendChild(r);
  });
}
$('membersBtn').onclick = () => { renderMembers(); $('memDlg').showModal(); };
$('memAdd').onclick = () => { members.push({id:uid(),name:'New member',color:'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0')}); renderMembers(); };
$('memDone').onclick = () => { members.forEach(m => m.name = m.name.trim() || 'Unnamed'); save(); fillMembers(); render(); $('memDlg').close(); };

$('prev').onclick = () => { view.setMonth(view.getMonth()-1); render(); };
$('next').onclick = () => { view.setMonth(view.getMonth()+1); render(); };
$('today').onclick = () => { view = new Date(); view.setDate(1); render(); };
$('addBtn').onclick = () => openEvent(null);
$('fMember').onchange = render;

$('exportBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({members,events},null,2)],{type:'application/json'}));
  a.download = 'family-calendar.json'; a.click();
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async ev => {
  try{
    const d = JSON.parse(await ev.target.files[0].text());
    if(!Array.isArray(d.members) || !Array.isArray(d.events)) throw 0;
    if(!confirm('Replace current calendar with imported data?')) return;
    members = d.members; events = d.events; save(); fillMembers(); render();
  }catch(e){ alert('Could not read that file.'); }
  ev.target.value = '';
};

function currentTheme(){
  const t = document.documentElement.dataset.theme;
  return t || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
}
function updateThemeBtn(){ $('themeBtn').textContent = currentTheme()==='dark' ? '☀️ Light' : '🌙 Dark'; }
try{ const t = localStorage.getItem('famcal.theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$('themeBtn').onclick = () => {
  const t = currentTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('famcal.theme', t); }catch(e){}
  updateThemeBtn();
};
updateThemeBtn();

// ---- shared sync via /api/calendar (Vercel + Redis); falls back to this device only if the API isn't reachable ----
var updatedAt = Number(store.get('famcal.updatedAt', 0)), synced = store.get('famcal.synced', false), pending = false, pushTimer = null;
// The passcode is never stored on the device. After it's accepted the server hands back a sign-in token
// that is valid for 24 hours; when it expires (or the passcode is changed) the passcode is asked for again.
let session = ''; try{ session = localStorage.getItem('famcal.session') || ''; localStorage.removeItem('famcal.pass'); }catch(e){}
let authDeclined = false;
const sessionLive = t => Number(String(t).split('.')[0]) > Date.now();
const setStatus = t => { $('sync').textContent = t; };
// ---- sign-in window (replaces the browser's plain prompt) ----
let authPromise = null, authResolve = null;
function setAuthBusy(busy){
  $('aPass').disabled = busy; $('aGo').disabled = busy; $('aGo').textContent = busy ? 'Checking…' : 'Unlock';
}
function showAuth(err){
  setAuthBusy(false);
  $('aErr').textContent = err || '';
  $('aPass').value = '';
  const dlg = $('authDlg');
  document.body.classList.add('locked', 'auth-open');    // hide the calendar completely behind the sign-in
  if(!dlg.open){ try{ dlg.showModal(); }catch(e){ dlg.setAttribute('open', ''); } }
  try{ $('aPass').focus(); }catch(e){}
}
function askPasscode(err){
  if(authPromise){                                       // several requests at once share one window
    if(!$('authDlg').open) showAuth(err);                // ...and a window that got closed underneath them is shown again
    return authPromise;
  }
  const p = new Promise(res => { authResolve = v => { authPromise = null; authResolve = null; res(v); }; });
  authPromise = p;
  if(typeof $('authDlg').showModal !== 'function'){      // older phones without <dialog> support: plain prompt instead
    document.body.classList.add('locked');
    const v = prompt(err || 'Enter the family passcode (you will be asked again after 24 hours):');
    authResolve(v);                                      // null when cancelled
    return p;
  }
  showAuth(err);
  return p;
}
function closeAuth(){ if($('authDlg').open) $('authDlg').close(); document.body.classList.remove('auth-open'); setAuthBusy(false); $('aErr').textContent = ''; }
function lockAuth(){                                      // too many wrong guesses: say so in the window
  if(!$('authDlg').open) return;
  $('aErr').textContent = '🔒 Too many wrong passcodes. Please try again in 15 minutes.';
  $('aPass').value = ''; $('aPass').disabled = true; $('aGo').disabled = true; $('aGo').textContent = 'Locked';
}
$('authForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('aPass').value;
  if(!v){ $('aErr').textContent = 'Please enter the passcode.'; $('aPass').focus(); return; }
  if(authResolve){ setAuthBusy(true); $('aErr').textContent = ''; authResolve(v); }
});
const cancelAuth = () => { if(authResolve) authResolve(null); closeAuth(); };
$('aCancel').onclick = cancelAuth;
$('authDlg').addEventListener('cancel', e => { e.preventDefault(); cancelAuth(); });
$('aShow').onchange = () => { $('aPass').type = $('aShow').checked ? 'text' : 'password'; };
$('authDlg').addEventListener('close', () => { $('aShow').checked = false; $('aPass').type = 'password'; });

async function api(method, body, passcode){
  const headers = {'Content-Type':'application/json'};
  if(passcode) headers['x-passcode'] = passcode; else if(session && sessionLive(session)) headers['x-session'] = session;
  let r;
  try{ r = await fetch('/api/calendar', {method, cache:'no-store', headers, body: body ? JSON.stringify(body) : undefined}); }
  catch(e){ if(!authPromise) closeAuth(); throw e; }               // a failed background request must not close a window someone is typing in
  if(r.status === 401){
    if(authDeclined || document.hidden){ if(!authPromise) closeAuth(); throw new Error('auth'); }   // never open the window in a background tab
    const p = await askPasscode(passcode ? 'That passcode was not accepted. Please try again.' : '');
    if(p === null){ authDeclined = true; throw new Error('auth'); }
    return api(method, body, p || undefined);            // undefined: someone else just signed in, so use that
  }
  if(r.status === 429){ lockAuth(); throw new Error('locked'); }
  if(!r.ok){ if(!authPromise) closeAuth(); throw new Error('HTTP ' + r.status); }
  const s = r.headers.get('X-Session');
  if(s){ session = s; try{ localStorage.setItem('famcal.session', s); }catch(e){} }
  authDeclined = false;
  if(authResolve) authResolve(undefined);                // anyone still waiting on the window can now just retry with the new sign-in
  closeAuth();
  document.body.classList.remove('locked'); updateLockBtn();
  return r.json();
}

// ---- Lock button + auto-lock after 15 minutes without use ----
const IDLE_MS = 15 * 60 * 1000;
let lastActive = Date.now();
const idleExpired = () => Date.now() - lastActive >= IDLE_MS;
function updateLockBtn(){ $('lockBtn').style.display = (session && sessionLive(session)) ? '' : 'none'; }
function lockNow(){
  session = ''; try{ localStorage.removeItem('famcal.session'); }catch(e){}
  document.querySelectorAll('dialog[open]').forEach(d => { if(d.id !== 'authDlg') d.close(); });
  document.body.classList.add('locked'); updateLockBtn();
  authDeclined = false; lastActive = Date.now();
  pull();                                   // no sign-in any more, so this opens the passcode window
}
$('lockBtn').onclick = lockNow;
$('unlockBtn').onclick = () => { authDeclined = false; pull(); };
['pointerdown','keydown','touchstart','scroll'].forEach(ev => addEventListener(ev, () => { if(!document.body.classList.contains('locked')) lastActive = Date.now(); }, {passive:true}));
setInterval(() => { if(session && sessionLive(session) && idleExpired()) lockNow(); }, 30000);
const failMsg = e => e && e.message === 'locked' ? '🔒 Too many wrong passcodes – try again in 15 minutes'
  : e && e.message === 'auth' ? '🔑 Passcode needed – click here to enter it' : 'Offline – saved on this device';
$('sync').style.cursor = 'pointer';
$('sync').onclick = () => { authDeclined = false; pull(); };
function schedulePush(){ if(DEMO) return; pending = true; clearTimeout(pushTimer); pushTimer = setTimeout(push, 400); }
async function push(){
  if(DEMO) return;
  try{
    setStatus('Saving…');
    const d = await api('PUT', {members, events});
    updatedAt = d.updatedAt; synced = true; pending = false;
    store.set('famcal.synced', true); saveLocal(); setStatus('✓ Shared');
  }catch(e){ pending = true; setStatus(failMsg(e)); }
}
function adopt(d){
  members = d.members; events = d.events.map(normalize); updatedAt = d.updatedAt;
  saveLocal();
  const f = $('fMember').value; fillMembers(); if([...$('fMember').options].some(o => o.value===f)) $('fMember').value = f;
  render();
}
async function pull(){
  if(DEMO || document.querySelector('dialog[open]')) return;
  if(pending){ await push(); return; }
  try{
    const d = await api('GET');
    if(!d.updatedAt){ await push(); return; }                 // nothing stored yet: upload this device's data
    if(!synced){                                               // first sync on this device: keep local-only events too
      const ids = new Set(d.events.map(e => e.id)), mids = new Set(d.members.map(m => m.id));
      const extra = events.filter(e => !ids.has(e.id));
      extra.forEach(e => { if(!mids.has(e.memberId)){ const m = members.find(x => x.id===e.memberId); if(m){ d.members.push(m); mids.add(m.id); } } });
      d.events = d.events.concat(extra);
      adopt(d); synced = true; store.set('famcal.synced', true);
      if(extra.length) await push();
    }else if(d.updatedAt > updatedAt) adopt(d);
    setStatus('✓ Shared');
  }catch(e){ setStatus(failMsg(e)); }
}
setInterval(pull, 15000);
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  if(session && sessionLive(session) && idleExpired()){ lockNow(); return; }
  authDeclined = false; pull();
});
updateLockBtn();

if(DEMO){
  document.body.style.paddingTop = '34px'; // room for the phone's status bar / camera cut-out in mockup.html
  const t = iso(new Date()), E = (id,title,off,len,memberId,type,start,end,repeat) => ({id,title,date:addDays(t,off),endDate:addDays(t,off+len),repeat:repeat||'none',until:'',allDay:!start,start:start||'',end:end||'',memberId,type,notes:''});
  events = [E('1','Soccer practice',0,0,'k1','Personal','16:00','17:00','weekly'), E('2','Piano lesson',0,0,'k2','Personal','18:30','19:15'),
    E('3','Family dinner',2,0,'all','Family'), E('4','Beach trip',-5,2,'all','Family'), E('5','Dentist',4,0,'mom','Personal','09:00','10:00'),
    E('6','Book club',7,0,'dad','Personal','19:00','21:00','monthly')];
  if(/theme=dark/.test(location.search)) document.documentElement.dataset.theme = 'dark';
}
buildTimeSelects(); fillMembers(); render(); updateThemeBtn();
if(DEMO && /dialog/.test(location.search)) openEvent(events[0]);
pull();
</script>
